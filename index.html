<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrotSMP Portal</title>
    <!-- Google Identity Services API SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Microsoft MSAL.js API SDK -->
    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>

    <style>
        :root {
            --bg-color: #1a120c;
            --panel-bg: #2d1e15;
            --panel-border: #4a3425;
            --primary-brown: #8b5a2b;
            --accent-brown: #b87333;
            --text-light: #f5f0eb;
            --text-muted: #a89f91;
            --input-bg: #150d08;
            --error: #c62828;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-light); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 800px; background-color: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; padding: 30px; }
        .auth-box { max-width: 400px; margin: 0 auto; text-align: center; }
        .btn { width: 100%; padding: 12px; margin-bottom: 12px; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
        .btn-ms { background-color: #2f2f2f; color: #fff; }
        .btn-primary { background-color: var(--primary-brown); color: var(--text-light); }
        .form-control { width: 100%; padding: 10px; background-color: var(--input-bg); border: 1px solid var(--panel-border); border-radius: 6px; color: var(--text-light); margin-bottom: 10px; }
        .hidden { display: none !important; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: var(--panel-bg); padding: 30px; border-radius: 10px; text-align: center; max-width: 400px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGIN BEREICH -->
        <div id="login-view" class="auth-box">
            <h2 style="margin-bottom: 20px;">BrotSMP Login</h2>

            <!-- Echter Google Button Container -->
            <div id="g_id_onload"
                 data-client_id="197841319216-c927a3k3qm466ib9rmnclfnf6ttd4vvr.apps.googleusercontent.com"
                 data-callback="handleGoogleLogin">
            </div>
            <div class="g_id_signin" data-type="standard" data-width="380" style="margin-bottom: 15px;"></div>

            <!-- Echter Microsoft Button -->
            <button class="btn btn-ms" onclick="loginWithMicrosoftAPI()">Mit Microsoft anmelden</button>

            <div style="margin: 20px 0; color: var(--text-muted);">oder E-Mail Login</div>

            <form onsubmit="handleEmailLogin(event)">
                <input type="email" id="email" class="form-control" placeholder="E-Mail" required>
                <input type="password" id="password" class="form-control" placeholder="Passwort" required>
                <button type="submit" class="btn btn-primary">Anmelden</button>
            </form>
        </div>

        <!-- DASHBOARD BEREICH -->
        <div id="dashboard-view" class="hidden">
            <h2>Willkommen, <span id="user-display-email"></span></h2>
            <p style="margin: 10px 0; color: var(--text-muted);">Du bist erfolgreich eingeloggt.</p>
            
            <div id="admin-tools" class="hidden" style="margin-top: 20px; background: var(--input-bg); padding: 15px; border-radius: 6px;">
                <h3>Admin-Bereich</h3>
                <p>Zugriff auf Konsole und Team-Verwaltung freigeschaltet.</p>
            </div>

            <button class="btn btn-primary" style="margin-top: 20px; width: auto; padding: 10px 20px;" onclick="logout()">Abmelden</button>
        </div>
    </div>

    <!-- OTP MODAL FÜR MAIN ADMIN -->
    <div id="otp-modal" class="modal">
        <div class="modal-content">
            <h3>OTP Sicherheit</h3>
            <p style="margin: 10px 0; font-size: 0.9rem; color: var(--text-muted);">Gib den 12-stelligen Code ein:</p>
            <div id="simulated-mail" style="background:#000; color:#0f0; padding:10px; margin-bottom:10px; font-family:monospace;">
                Code: <span id="code-val"></span>
            </div>
            <input type="text" id="otp-input" class="form-control" maxlength="12" placeholder="12 Zahlen">
            <button class="btn btn-primary" onclick="verifyOTP()">Verifizieren</button>
        </div>
    </div>

    <script>
        // --- MICROSOFT CONFIGURATION ---
        const msalConfig = {
            auth: {
                clientId: "DEINE_MICROSOFT_CLIENT_ID", // Aus dem Azure Portal
                authority: "https://login.microsoftonline.com/common"
            }
        };
        const msalInstance = new msal.PublicClientApplication(msalConfig);

        let generatedOTP = "";
        let pendingAdminEmail = "";

        // 1. ECHTER GOOGLE LOGIN CALLBACK
        function handleGoogleLogin(response) {
            // Dekodiert das JWT Token von Google
            const responsePayload = parseJwt(response.credential);
            const userEmail = responsePayload.email;
            
            console.log("Google User E-Mail:", userEmail);
            checkUserAuth(userEmail);
        }

        // Hilfsfunktion zum Entschlüsseln des Google Tokens
        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(window.atob(base64));
        }

        // 2. ECHTER MICROSOFT LOGIN
        async function loginWithMicrosoftAPI() {
            try {
                const loginResponse = await msalInstance.loginPopup({ scopes: ["user.read"] });
                const userEmail = loginResponse.account.username;
                console.log("Microsoft User E-Mail:", userEmail);
                checkUserAuth(userEmail);
            } catch (err) {
                console.error("Microsoft Login Fehler:", err);
            }
        }

        // 3. EMAIL/PASSWORT LOGIN
        function handleEmailLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            checkUserAuth(email);
        }

        // 4. AUTHENTIFIZIERUNG PRÜFEN & OTP AUSLÖSEN
        function checkUserAuth(email) {
            if (email === "brotsmp@gmail.com") {
                pendingAdminEmail = email;
                // Erstelle 12 Zufallszahlen
                generatedOTP = "";
                for(let i = 0; i < 12; i++) {
                    generatedOTP += Math.floor(Math.random() * 10);
                }
                document.getElementById('code-val').textContent = generatedOTP;
                document.getElementById('otp-modal').style.display = 'flex';
            } else {
                loginSuccess(email, false);
            }
        }

        function verifyOTP() {
            const input = document.getElementById('otp-input').value;
            if (input === generatedOTP) {
                document.getElementById('otp-modal').style.display = 'none';
                loginSuccess(pendingAdminEmail, true);
            } else {
                alert("Falscher Code!");
            }
        }

        function loginSuccess(email, isAdmin) {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            document.getElementById('user-display-email').textContent = email;

            if (isAdmin) {
                document.getElementById('admin-tools').classList.remove('hidden');
            }
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
